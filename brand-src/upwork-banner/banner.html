<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
@font-face{font-family:"SG";src:url("SpaceGrotesk.ttf") format("truetype");font-weight:300 700}
html,body{margin:0;padding:0}
.b{position:relative;width:3200px;height:320px;overflow:hidden;background:#040913;font-family:Inter,sans-serif;color:#fff}
.g1{position:absolute;left:-200px;top:-500px;width:1900px;height:1300px;background:radial-gradient(closest-side,rgba(8,126,164,.55),rgba(4,89,117,.25) 45%,transparent 72%)}
.g2{position:absolute;left:1500px;top:-400px;width:1400px;height:1000px;background:radial-gradient(closest-side,rgba(88,196,220,.14),transparent 70%)}
.vig{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,9,19,0) 0%,rgba(4,9,19,0) 60%,rgba(4,9,19,.35) 100%)}
.globe{position:absolute;left:2560px;top:-110px;width:920px;height:920px}
.copy{position:absolute;left:850px;top:0;width:1500px;height:320px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;text-align:center}
h1{margin:0;font-family:SG,sans-serif;font-size:100px;font-weight:700;letter-spacing:-.03em;line-height:1;color:#fff;white-space:nowrap}
.sub{font-size:29px;font-weight:400;color:rgba(255,255,255,.78);letter-spacing:.005em;white-space:nowrap}
</style></head><body>
<div class="b">
  <div class="g1"></div><div class="g2"></div><div class="vig"></div>
  <img class="globe" src="globe.svg">
  <div class="copy"><h1>Software Built To Last</h1><div class="sub">Custom web &amp; mobile apps for startups and growing businesses</div></div>
</div></body></html>
